# ci.yml — per-repo consumer for the skill publication-hygiene gate.
#
# This consumer carries only triggers and delegates to the reusable workflow in
# swift-institute/.github.
#
# What is gated, and what is deliberately not
#
# The checks cover mechanical, objective facts: does the frontmatter parse, does
# each skill have a name and a description, does every relative link resolve, and
# is anything published that should not have been. They cover NOTHING about the
# writing — no length ceiling, no line cap, no required section, no opinion about
# tone or structure. Skills are lightweight guides that carry judgment rather
# than prescription.
#
# Why the triggers are wider than the gate they replace
#
# The retired job fired only on '**/SKILL.md'. Three of the five checks read
# every markdown file, and companion documents are where progressive disclosure
# puts the detail — so a companion-only edit has to be gated too, or the check
# that most needs to run is the one that never does.
#
# Why the reusable is pinned to a commit rather than @main
#
# Its predecessor pinned '@main'. That is a floating ref: a green tick proved
# nothing about the code that produced it, because the callee could change
# without the caller changing. Pinning makes a run reproducible from its caller.
#
# Honest limit: this pins the workflow, not everything it executes. The base it
# delegates to resolves the validator script from swift-institute/.github at
# 'main', so the script itself still floats. Closing that needs a ref input on
# the base workflow, which is a change to shared infrastructure and is being
# proposed separately rather than folded in here.

name: ci

on:
  push:
    branches: [main]
    tags:
      - '*'
    paths:
      - '**/*.md'
      - '.github/workflows/ci.yml'
  pull_request:
    paths:
      - '**/*.md'
      - '.github/workflows/ci.yml'
  workflow_dispatch: {}

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  skill-hygiene:
    # swift-institute/.github @ 0d0c68f923456b4f791000b872c9b3388bd55926
    uses: swift-institute/.github/.github/workflows/validate-skill-hygiene.yml@0d0c68f923456b4f791000b872c9b3388bd55926
    with:
      repo: swift-institute/Skills
    secrets: inherit
